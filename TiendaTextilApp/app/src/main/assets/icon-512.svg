<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="fabricGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="116" stroke="rgba(255,255,255,0.12)" stroke-width="4" fill="none" />

  <!-- Textile Bolt / Fabric Roll Graphic -->
  <g filter="url(#shadow)" transform="translate(40, 20)">
    <!-- Woven fabric curves -->
    <path d="M120 180 C 180 120, 260 120, 320 180 C 370 230, 340 320, 280 340 C 220 360, 160 300, 120 240 Z" fill="url(#fabricGrad)" opacity="0.9" />
    <path d="M100 240 C 160 180, 240 190, 300 250 C 350 300, 310 380, 240 390 C 180 400, 130 350, 100 300 Z" fill="#0284c7" opacity="0.8" />
    
    <!-- Textile spool / roll central cylinder -->
    <ellipse cx="216" cy="200" rx="44" ry="76" fill="#0f172a" stroke="#38bdf8" stroke-width="8" transform="rotate(-30 216 200)" />
    
    <!-- Golden needle running through -->
    <path d="M340 100 L 160 380" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" />
    <circle cx="340" cy="100" r="14" fill="#fbbf24" stroke="#d97706" stroke-width="4" />
    <circle cx="340" cy="100" r="5" fill="#0f172a" />
    
    <!-- Thread winding gracefully -->
    <path d="M340 100 C 380 140, 390 220, 330 270 C 270 320, 190 320, 150 390" fill="none" stroke="#fcd34d" stroke-width="6" stroke-dasharray="8 6" stroke-linecap="round" />
  </g>

  <!-- Brand Typography Badge -->
  <rect x="96" y="380" width="320" height="64" rx="32" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <text x="256" y="423" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">D&amp;D TEXTIL</text>
</svg>
